<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>星元会销 · 智启经营（深圳·私域专场）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#1F2233; --ink2:#6B6F8A; --ink3:#8B8FA8; --ink4:#B9BCD0;
  --brand:#5B4BF5; --brand2:#8E7BFF; --brand3:#A5A3F7;
  --accent:#FF5C45; --bg:#F2F3FD; --bar:#D8D9EE;
  --chip:#E9EAF4; --chip2:#F4F5FA; --line:#E2E3F5; --brandsoft:#EEECFF; --brandsoft:#EEECFF;
}
body{background:#E9EAF2;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
     color:var(--ink);-webkit-font-smoothing:antialiased;padding:34px 0 80px}
.dochead{width:min(1000px,92vw);margin:0 auto 26px}
.dochead h1{font-size:23px;letter-spacing:.01em}
.dochead p{margin-top:9px;font-size:13px;color:#5B6070;line-height:1.8}
.dochead .tags{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
.dochead .tags span{font-size:11.5px;padding:4px 11px;border-radius:99px;background:#fff;color:#5B6070;border:1px solid #DCDDE8}
.wrap{width:min(1000px,92vw);margin:0 auto}
.page{margin-bottom:34px}
.stage{position:relative;width:100%;overflow:hidden;border-radius:6px;box-shadow:0 10px 30px rgba(31,34,51,.16)}
.frame{width:960px;height:540px;transform-origin:top left;position:relative}
.cap{margin-top:11px;font-size:12.5px;color:#5B6070;line-height:1.75;display:flex;gap:10px;align-items:baseline}
.cap .lab{flex:none;font-size:11.5px;font-weight:700;color:#fff;background:var(--brand);padding:2px 9px;border-radius:4px;letter-spacing:.03em}

/* ---------- 幻灯片基底 ---------- */
.slide{position:absolute;top:0;left:0;width:960px;height:540px;background:var(--bg);overflow:hidden}
.slide::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(120% 90% at 12% 4%, #FBFCFF 0%, rgba(251,252,255,0) 62%),
    radial-gradient(95% 80% at 96% 100%, #E1E5FF 0%, rgba(225,229,255,0) 58%),
    radial-gradient(70% 60% at 88% 6%, #EFF3FF 0%, rgba(239,243,255,0) 60%)}
.hd{position:absolute;left:48px;top:15px;width:864px;height:65px;background:var(--bar);border-radius:2px}
.hd .mk{position:absolute;left:0;top:26px;width:6px;height:23px;background:var(--brand)}
.hd h1{position:absolute;left:17px;top:16px;font-size:27px;font-weight:700;letter-spacing:.005em}
.hd .en{position:absolute;right:1px;top:41px;font-size:9.5px;color:var(--ink3);letter-spacing:.11em}
.ft{position:absolute;left:48px;right:48px;bottom:12px;height:18px}
.ft .lg{position:absolute;left:0;bottom:1px;height:15px;opacity:.9}
.ft .pn{position:absolute;right:0;bottom:0;font-size:10.5px;color:var(--ink3)}

/* ---------- 演示页 ---------- */
.lft{position:absolute;left:48px;top:99px;width:208px;height:401px}
.pain{height:280px;border-radius:5px;padding:15px 16px;color:#fff;overflow:hidden;
  background:linear-gradient(150deg,#5B4BF5 0%,#8E7BFF 100%);box-shadow:0 8px 20px rgba(91,75,245,.22)}
.pain .eb,.route .eb{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
.pain .eb{color:rgba(255,255,255,.66)}
.pain ul{list-style:none;margin-top:13px}
.pain li{display:flex;gap:9px;margin-bottom:11px}
.pain li:last-child{margin-bottom:0}
.pain li .n{flex:none;font-size:11.5px;font-weight:700;color:rgba(255,255,255,.5);padding-top:1px;font-variant-numeric:tabular-nums}
.pain li .t{font-size:11px;line-height:1.3;font-weight:500;word-break:break-word}
.uplift{margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.26)}
.uplift p{margin-top:7px;font-size:11.5px;line-height:1.48;color:rgba(255,255,255,.96)}
.route{height:117px;margin-top:12px;border-radius:5px;padding:14px 15px;overflow:hidden;
  background:rgba(255,255,255,.74);border:1px solid var(--line)}
.route .eb{color:var(--ink3)}
.route .rrow{margin-top:8px;font-size:11px;line-height:1.5;display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.route .rrow:first-of-type{margin-top:9px}
.route .rbox{display:none}
.route .rbox.on{display:block}

/* ---- 开场轮播页 ---- */
.car{background:linear-gradient(160deg,#F4F3FF 0%,#EDEBFF 46%,#F2F3FD 100%)}
.car .carhd{position:absolute;left:48px;top:22px}
.car .cartitle{font-size:24px;font-weight:700;color:var(--ink);letter-spacing:.01em}
.car .cwrap{position:absolute;left:0;right:0;top:70px;height:434px;display:flex;
  gap:16px;align-items:center;justify-content:center}
.car .ctile{position:relative;width:216px;height:384px;border-radius:12px;overflow:hidden;
  background:#0B0E1A;box-shadow:0 14px 34px rgba(40,34,110,.16);opacity:.5;
  transform:scale(.94);transition:all .45s cubic-bezier(.42,0,.2,1)}
.car .ctile.on{opacity:1;transform:scale(1);box-shadow:0 20px 46px rgba(40,34,110,.26)}
.car .cvsrc{width:100%;height:100%;object-fit:cover;display:block}
.car .cnum{position:absolute;left:12px;top:10px;font-size:11px;font-weight:700;color:#fff;
  background:rgba(20,18,50,.42);border-radius:5px;padding:3px 7px;backdrop-filter:blur(6px)}
.car .ctile.paused::after{content:"▶";position:absolute;inset:0;display:flex;
  align-items:center;justify-content:center;font-size:26px;color:rgba(255,255,255,.92);
  background:rgba(10,10,28,.34);backdrop-filter:blur(1px)}
.car .cplay{position:absolute;left:0;right:0;top:70px;height:434px;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:13px;cursor:pointer;
  background:rgba(232,231,247,.62);backdrop-filter:blur(3px);transition:opacity .35s}
.car .cplay.off{opacity:0;pointer-events:none}
.car .cpbtn{width:76px;height:76px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:25px;color:#fff;padding-left:4px;
  background:linear-gradient(135deg,#5B4BF5,#8E7BFF);box-shadow:0 12px 30px rgba(91,75,245,.36)}

/* ---- 竖屏全屏：两侧铺同源虚化背景，不再黑边 ---- */
.vstage:fullscreen,.vstage:-webkit-full-screen{background:#2B2350}
.vstage:fullscreen .vblur,.vstage:-webkit-full-screen .vblur{
  display:block;position:absolute;inset:-6%;z-index:0;background-size:cover;background-position:center;
  filter:blur(38px) brightness(.62) saturate(1.25);transform:scale(1.08)}
.vstage .vblur{display:none;background-size:cover;background-position:center;
  background-image:linear-gradient(135deg,#5B4BF5,#2B2350 60%,#8E7BFF)}
.vstage:fullscreen .vsrc,.vstage:-webkit-full-screen .vsrc{position:relative;z-index:1}
/* 竖图全屏：底图用同一张图的虚化版（清晰图铺底看着像重影） */
.quad-c:fullscreen,.mix-c:fullscreen,.quad-c:-webkit-full-screen,.mix-c:-webkit-full-screen{
  background:transparent !important}
.quad-c:fullscreen::before,.mix-c:fullscreen::before{content:"";position:absolute;inset:-8%;
  z-index:0;background-image:var(--bgimg);background-size:cover;background-position:center;
  filter:blur(36px) brightness(.62) saturate(1.15)}
.quad-c:fullscreen img,.mix-c:fullscreen img{position:relative;z-index:1}/* ---- 现场体验页 ---- */
.exp .expleft{position:absolute;left:48px;top:104px;width:230px}
.exp .expno{font-size:96px;font-weight:700;color:var(--brand);line-height:1;letter-spacing:-.05em}
.exp .expjob{margin-top:16px}
.exp .exptask{font-size:19px;font-weight:700;line-height:1.45;color:var(--ink);margin-top:7px}
.exp .expright{position:absolute;left:300px;top:104px;width:612px}
.exp .eb{font-size:9.5px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase}
.expblk{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.expstep{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:var(--ink);margin-top:11px}
.expstep .sn{flex:none;width:20px;height:20px;border-radius:5px;background:var(--brandsoft);
  color:var(--brand);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.expprompt{margin-top:8px;background:linear-gradient(135deg,#F4F3FF,#EEEBFF);border:1px solid #DCD8FF;
  border-radius:6px;padding:11px 13px;font-size:13.5px;line-height:1.6;color:#3B3560}
.expkeep{margin-top:12px;background:rgba(255,255,255,.66);border:1px solid var(--line);
  border-radius:8px;padding:13px 18px}
.expkeeptxt{font-size:14px;font-weight:700;color:var(--brand);margin-top:6px;line-height:1.5}
.expnote{margin-top:10px;font-size:11.5px;color:var(--ink3)}
/* ---- 尾页 ---- */
.fin .finleft{position:absolute;left:88px;top:170px;width:440px}
.fin .fint{font-size:42px;font-weight:700;line-height:1.28;color:var(--ink)}
.fin .finline{width:56px;height:3px;background:var(--brand);border-radius:2px;margin:22px 0}
.fin .find{font-size:13.5px;line-height:1.75;color:var(--ink2)}
.fin .finsign{margin-top:26px;font-size:11px;color:var(--ink3);letter-spacing:.02em}
.fin .finqr{position:absolute;left:50%;top:50%;width:192px;text-align:center;margin-left:-96px;margin-top:-110px}/* 子雁 2026-09-21：二维码移到页面正中间，尺寸不变（192px） */
.fin .qr{width:192px;height:192px;border-radius:12px;background:#fff;padding:10px;object-fit:contain;
  box-shadow:0 10px 30px rgba(91,75,245,.14)}
.fin .qr.ph{border:2px dashed #C9C6F0;background:rgba(255,255,255,.55);box-shadow:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:0}
.fin .phline{font-size:17px;font-weight:700;color:var(--brand);line-height:1.4}
.fin .phsub{font-size:10.5px;color:var(--ink3);line-height:1.5}
.fin .finqrtxt{margin-top:12px;font-size:11.5px;color:var(--ink3)}
.route .seg{color:var(--ink2)}
.route .seg.first{color:var(--brand);font-weight:700}
.route .sep{color:var(--ink4);padding:0 1px;font-size:10.5px}

.rgt{position:absolute;left:276px;top:99px;width:636px;height:401px}
.chips{position:absolute;left:0;top:0;width:636px;height:26px;display:flex;gap:5px;overflow:hidden}
.chip{font:inherit;cursor:pointer;flex:none;border:1px solid var(--line);background:rgba(255,255,255,.7);
  border-radius:4px;padding:0 9px;height:25px;display:flex;align-items:center;
  font-size:11px;color:var(--ink2);transition:.15s;white-space:nowrap}
.chip.ghost{border-style:dashed;border-color:#C9CCE0;background:rgba(255,255,255,.42);color:var(--ink3);
  cursor:default;width:auto;padding:0 9px}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip:not(.on):hover{background:#fff}
.panes{position:absolute;left:0;top:31px;width:588px}
.pane{display:none}
.pane.on{display:block}
.draw{position:relative;width:636px;height:331px;border-radius:6px;overflow:hidden;box-shadow:0 10px 24px rgba(31,34,51,.16)}
/* 内容框：内容超出一屏时在框内下滑 */
.scroll-y{overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;scrollbar-width:thin;
  scrollbar-color:rgba(31,34,51,.24) transparent}
.scroll-y::-webkit-scrollbar{width:6px}
.scroll-y::-webkit-scrollbar-track{background:transparent}
.scroll-y::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(31,34,51,.24)}
.scroll-y::-webkit-scrollbar-thumb:hover{background:rgba(31,34,51,.38)}
.note{margin-top:6px;height:33px;font-size:11.5px;line-height:1.35;color:var(--ink2);overflow-y:auto;scrollbar-width:thin;
  scrollbar-color:rgba(31,34,51,.2) transparent}
.note::-webkit-scrollbar{width:5px}
.note::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(31,34,51,.2)}

/* 录屏画布 */
.mp{background:#1F2233;display:flex;flex-direction:column}
.vmeta{height:34px;flex:none;display:flex;align-items:center;gap:9px;padding:0 15px;background:rgba(255,255,255,.07);
  border-bottom:1px solid rgba(255,255,255,.08)}
.vmeta .vname{font-size:11.5px;color:rgba(255,255,255,.92)}
.vmeta .dur{font-size:10.5px;color:rgba(255,255,255,.55)}
/* 自定义视频控制条：只有 播放 / 进度 / 全屏 */
.vbar{position:absolute;left:0;right:0;bottom:0;height:36px;display:flex;align-items:center;
  gap:11px;padding:0 13px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.55))}
.vpb{width:26px;height:26px;flex:none;border:0;background:transparent;color:#fff;cursor:pointer;
  padding:0;display:inline-flex;align-items:center;justify-content:center}
.vpb i{display:block;width:0;height:0;margin-left:2px;
  border-left:12px solid currentColor;border-top:7.5px solid transparent;border-bottom:7.5px solid transparent}
.vpb.on i{width:11px;height:13px;margin-left:0;border:0;background:
  linear-gradient(90deg,currentColor 0 3.5px,rgba(0,0,0,0) 3.5px 7.5px,currentColor 7.5px 11px)}
.vseek{flex:1;min-width:0;height:3px;-webkit-appearance:none;appearance:none;
  background:rgba(255,255,255,.32);border-radius:2px;outline:none;cursor:pointer}
.vseek::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;
  background:#fff;cursor:pointer}
.vtime{flex:none;font-size:10.5px;color:rgba(255,255,255,.78);font-variant-numeric:tabular-nums}
.vbar .vfs{margin-left:0}
.vfs{width:28px;height:28px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  border:0;border-radius:6px;background:transparent;color:rgba(255,255,255,.88);cursor:pointer;
  padding:0;transition:background .15s,color .15s}
.vfs:hover{background:rgba(255,255,255,.18);color:#fff}
.vfs svg{width:16px;height:16px}
.vfs .ic-con{display:none}
.vfs.on .ic-exp{display:none}
.vfs.on .ic-con{display:inline-block}
/* 双栏画布：左侧截图竖向拼接可下滑；右侧录屏按自身比例占宽（不平分） */
.duo{background:#0F1220;display:flex;align-items:stretch}
.duo-l{flex:1 1 auto;min-width:0;position:relative;overflow-y:auto;overscroll-behavior:contain;
  scroll-behavior:smooth;background:#fff;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.3) transparent}
.duo-l::-webkit-scrollbar{width:6px}
.duo-l::-webkit-scrollbar-track{background:transparent}
.duo-l::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(0,0,0,.3)}
/* 报告 HTML 画布：iframe 原样嵌入。
   ⚠️ 关键点：iframe 的 viewport 宽就是 636，报告按自己那套响应式规则排版，
   字号保持报告原生字号 —— 别用「先按大宽度渲染再缩放」那套（截图才需要），
   否则字会被压小。内容超一屏时在框内下滑，报告自己带滚动条。 */
.emb{background:#fff}
.emb .embf{display:block;width:100%;height:100%;border:0;background:#fff}
.duo-img{display:block;width:100%;height:auto}
.duo-img+.duo-img{border-top:1px solid rgba(15,23,42,.14)}
/* ⚠️ 这里原来 padding-left:12px —— 会在图与视频之间留一条 12px 黑色缝。
   改成 1px 细线（同 quad），素材紧贴。 */
.duo-r{flex:0 0 auto;position:relative;padding-left:0;border-left:1px solid #0F1220;
  display:flex;align-items:stretch}
.duo-r .vstage{position:relative;height:100%;display:flex;align-items:center;overflow:hidden}
.duo-r .vsrc{height:100%;width:auto;max-height:none;max-width:none}
.duo-r .vbar{gap:7px;padding:0 8px}
.duo-r .vtime{display:none}
/* 双栏·平分：两张都是竖屏（0.46）素材 → 左右各占一半，各自按高度撑满；
   图靠右、视频靠左，两者在中缝相邻，整组在画布里居中。
   ⚠️ .vstage 必须 flex:0 0 auto 收成视频宽度，否则 .vbar（absolute left:0 right:0）
   会横跨整个半栏，进度条比视频还长。 */
.duo.duo-eq .duo-l{flex:1 1 0;display:flex;align-items:center;justify-content:flex-end;
  overflow:hidden}
.duo.duo-eq .duo-l .duo-img{width:auto;height:100%;max-width:none}
.duo.duo-eq .duo-r{flex:1 1 0;min-width:0;padding-left:0;justify-content:flex-start;
  border-left:1px solid rgba(255,255,255,.12)}
.duo.duo-eq .duo-r .vstage{flex:0 0 auto;justify-content:flex-start}
/* 四宫格：3 张竖屏截图 + 1 段竖屏录屏，各占 1/4 宽。
   素材铺满整格（object-fit:cover，竖屏 0.46 只裁掉约 2% 上下边），
   格与格之间只留 1px 画布底色 → 就是子雁要的「一条细线」，不是大黑缝。 */
.quad{background:#0F1220;display:flex;align-items:stretch}
.quad-c{flex:1 1 0;min-width:0;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.quad-c+.quad-c{border-left:1px solid #0F1220}
.quad-c .duo-img{display:block;width:100%;height:100%;object-fit:cover;max-width:none}
.quad-c .vstage{flex:1 1 auto;height:100%;min-width:0}
.quad-c .vsrc{width:100%;height:100%;object-fit:cover;max-width:none;max-height:none}
/* 纯截图画布：竖向拼接、框内可下滑 */
.shots{background:#fff;display:flex}
.shots:has(.shots-bar){flex-direction:column}
.shots-bar{flex:none;display:flex;gap:8px;padding:9px 12px;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.78),#fff 42%);border-top:1px solid rgba(15,23,42,.10)}
.lbtn{cursor:pointer;text-decoration:none;flex:none;border:1px solid var(--brand);border-radius:4px;
  padding:0 12px;height:27px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:#fff;
  background:var(--brand);transition:.15s;white-space:nowrap}
.lbtn:hover{filter:brightness(1.08)}
/* 可点素材图：整张图就是入口（报告类素材直接铺全文长图，点击新窗口打开原文件） */
.shot-a{display:block;position:relative;text-decoration:none;cursor:pointer}
.shot-a .duo-img{transition:filter .15s}
.shot-a:hover .duo-img{filter:brightness(.985)}
.shot-hint{position:absolute;top:10px;right:10px;z-index:2;pointer-events:none;
  font-size:11px;font-weight:700;color:#fff;background:rgba(31,34,51,.72);
  border-radius:4px;padding:4px 9px;backdrop-filter:blur(2px)}
/* 图内精确热区：透明覆盖，静态画面无痕；鼠标移上去才描边提示 */
.shot-wrap{position:relative}
.shot-hot{position:absolute;display:block;border-radius:6px;cursor:pointer;
  transition:background .15s,box-shadow .15s}
.shot-hot:hover{background:rgba(90,80,230,.12);box-shadow:0 0 0 2px rgba(90,80,230,.5) inset}
.shots-l{flex:1 1 auto;min-width:0;position:relative;overflow-y:auto;overscroll-behavior:contain;
  scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.3) transparent}
.shots-l::-webkit-scrollbar{width:6px}
.shots-l::-webkit-scrollbar-track{background:transparent}
.shots-l::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(0,0,0,.3)}
.shots-cmd{padding:18px 16px 24px}
.shots-cmd .cmdbox{flex:none;margin-top:10px}
/* 拼在截图后面的会话分享：跟着外层一起滑，自己不再滚动 */
.sse-embed{background:#fff;border-top:1px solid var(--line)}
.sse-embed .sse-inner{height:auto;overflow:visible;padding-bottom:28px}
/* 混排画布：左栏宽幅截图竖排可滑，右栏竖版素材并排（图/录屏同宽高，1px 细线分隔） */
.mix{background:#0F1220;display:flex;align-items:stretch}
.mix-l{flex:1 1 auto;min-width:0;position:relative;overflow-y:auto;overscroll-behavior:contain;
  scroll-behavior:smooth;background:#fff;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.3) transparent}
.mix-l::-webkit-scrollbar{width:6px}
.mix-l::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(0,0,0,.3)}
.mix-l .duo-img+.duo-img{border-top:1px solid rgba(15,23,42,.14)}
.mix-r{flex:0 0 auto;display:flex;align-items:stretch;border-left:1px solid #0F1220}
.mix-c{flex:0 0 auto;display:flex;align-items:center;overflow:hidden;border-left:1px solid #0F1220}
.mix-c:first-child{border-left:0}
.mix-c>.duo-img{width:auto;height:100%;max-width:none}
.mix-c .vstage{flex:0 0 auto;height:100%}
.mix-c .vsrc{height:100%;width:auto;max-height:none;max-width:none}
/* 截图可点全屏：全屏时按原比例居中（不裁切），右下角给个hover才出现的小全屏图标 */
.quad-c.zoomy,.mix-c.zoomy{cursor:zoom-in}
.quad-c.zoomy:fullscreen,.quad-c.zoomy:-webkit-full-screen,
.mix-c.zoomy:fullscreen,.mix-c.zoomy:-webkit-full-screen{background:#0F1220}
.quad-c:fullscreen .duo-img,.quad-c:-webkit-full-screen .duo-img,
.mix-c:fullscreen .duo-img,.mix-c:-webkit-full-screen .duo-img{
  width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
.quad-c.zoomy::after,.mix-c.zoomy::after{
  content:"⤢";position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:5px;
  background:rgba(15,18,32,.62);color:#fff;font-size:13px;line-height:22px;text-align:center;
  opacity:0;transition:opacity .16s}
.quad-c.zoomy:hover::after,.mix-c.zoomy:hover::after{opacity:1}

/* 全屏（容器全屏）：背景黑，控制条放大，绝无浏览器自带控件 */
.vstage:fullscreen,.vstage:-webkit-full-screen{background:#000;display:flex;align-items:center;
  justify-content:center}
.vstage:fullscreen .vbar,.vstage:-webkit-full-screen .vbar{height:64px;padding:0 30px;gap:18px}
.vstage:fullscreen .vpb,.vstage:-webkit-full-screen .vpb{width:40px;height:40px}
.vstage:fullscreen .vpb i,.vstage:-webkit-full-screen .vpb i{
  border-left-width:18px;border-top-width:12px;border-bottom-width:12px}
.vstage:fullscreen .vpb.on i,.vstage:-webkit-full-screen .vpb.on i{width:17px;height:20px;
  background:linear-gradient(90deg,currentColor 0 5px,rgba(0,0,0,0) 5px 12px,currentColor 12px 17px)}
.vstage:fullscreen .vseek,.vstage:-webkit-full-screen .vseek{height:5px}
.vstage:fullscreen .vseek::-webkit-slider-thumb,.vstage:-webkit-full-screen .vseek::-webkit-slider-thumb{
  width:17px;height:17px}
.vstage:fullscreen .vtime,.vstage:-webkit-full-screen .vtime{font-size:15px}
.vstage:fullscreen .vfs,.vstage:-webkit-full-screen .vfs{width:38px;height:38px}
/* 全屏时竖屏视频按自身比例居中（两侧黑边）—— 不要被格子里那句 object-fit:cover 撑满整屏 */
.vstage:fullscreen .vsrc,.vstage:-webkit-full-screen .vsrc{
  width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
.vstage:fullscreen .vfs svg,.vstage:-webkit-full-screen .vfs svg{width:22px;height:22px}
.vstage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.vsrc{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.vplay{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);position:relative}
.vplay::after{content:"";position:absolute;left:23px;top:18px;border-left:20px solid #fff;
  border-top:12px solid transparent;border-bottom:12px solid transparent}

/* 会话实录 / 网页画布 */
.bw{background:#fff;display:flex;flex-direction:column}
.bwbar{height:32px;flex:none;background:#EDEFF6;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line)}
.bwbar i{width:8px;height:8px;border-radius:50%;background:#CFD3E0}
.bwbar .url{margin-left:8px;font-size:10.5px;color:var(--ink3);background:#fff;border-radius:3px;padding:3px 12px;flex:1;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bwbody{flex:1;position:relative;overflow:hidden}
/* 会话分享画布 —— 一比一复刻微盟星元真实分享页
   真实值 × --sse-s 缩放；改 sse-s 即可整体放大缩小 */
.sse{background:#fff;--sse-s:.8}
.sse-inner{position:relative;z-index:1;height:100%;padding:calc(32px * var(--sse-s)) 15px calc(40px * var(--sse-s));
  display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
  scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(31,34,51,.24) transparent}
.sse-inner::-webkit-scrollbar{width:6px}
.sse-inner::-webkit-scrollbar-track{background:transparent}
.sse-inner::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(31,34,51,.24)}
.sse-head{display:flex;align-items:center;gap:calc(16px * var(--sse-s));
  padding-bottom:calc(22px * var(--sse-s));border-bottom:1px solid #eef0f3}
.sse-brand{display:grid;place-items:center;width:calc(48px * var(--sse-s));height:calc(48px * var(--sse-s));
  flex:0 0 auto;border-radius:calc(14px * var(--sse-s));color:#fff;
  background:linear-gradient(135deg,#6d5dfc,#8b5cf6);
  font-size:calc(17px * var(--sse-s));font-weight:700}
.sse-meta h1{margin:0;color:#111827;font-size:calc(22px * var(--sse-s));line-height:1.35;font-weight:600}
.sse-meta p{margin:calc(6px * var(--sse-s)) 0 0;color:#9ca3af;font-size:calc(13px * var(--sse-s))}
.sse-notice{margin-top:calc(18px * var(--sse-s));padding:calc(10px * var(--sse-s)) calc(14px * var(--sse-s));
  border-radius:calc(8px * var(--sse-s));color:#6b7280;background:#f7f8fa;
  font-size:calc(13px * var(--sse-s));line-height:1.5}
.sse-msgs{padding:calc(26px * var(--sse-s)) 0}
.sse-msg{display:flex;gap:calc(10px * var(--sse-s))}
.sse-msg.user{flex-direction:row-reverse;justify-content:flex-start}
.sse-msg.ai{align-items:flex-start;margin-top:calc(22px * var(--sse-s))}
.sse-msg.user:not(:first-child){margin-top:calc(16px * var(--sse-s))}

/* 用户消息：浅灰气泡 + 复制按钮（真实 _userBubble / _userContentStack） */
.sse-ustack{display:flex;flex-direction:column;align-items:flex-end;gap:calc(8px * var(--sse-s));width:100%}
.sse-ubub{max-width:min(76%,calc(360px * var(--sse-s)));padding:calc(9px * var(--sse-s)) calc(14px * var(--sse-s));
  border-radius:calc(16px * var(--sse-s)) calc(16px * var(--sse-s)) calc(4px * var(--sse-s));
  background:#f3f4f6;color:#111827;
  font-size:calc(14px * var(--sse-s));line-height:calc(22px * var(--sse-s))}
.sse-uact{display:flex;align-items:center;gap:calc(2px * var(--sse-s));opacity:.55}
.sse-uact .btn{display:inline-flex;align-items:center;justify-content:center;
  width:calc(32px * var(--sse-s));height:calc(32px * var(--sse-s));
  border-radius:calc(6px * var(--sse-s));color:#8a8f9c}

/* 星元回复：AI logo + 查看处理详情 + 正文 */
.sse-aibody{min-width:0;max-width:100%;width:100%}
.sse-aihead{display:flex;align-items:center}
.sse-aimark{display:inline-flex;align-items:center;justify-content:flex-start;
  width:calc(104px * var(--sse-s));height:calc(32px * var(--sse-s))}
.sse-aimark img{display:block;width:calc(90px * var(--sse-s));height:auto;
  max-height:calc(32px * var(--sse-s));object-fit:contain}
.sse-blocks{margin-top:calc(10px * var(--sse-s));display:flex;flex-direction:column;gap:calc(8px * var(--sse-s))}
.sse-hist{display:flex;align-items:center;width:100%;min-height:calc(32px * var(--sse-s));
  border-bottom:1px solid #e9eaf0;margin-bottom:calc(8px * var(--sse-s))}
.sse-hist button{display:flex;flex-wrap:nowrap;align-items:center;gap:calc(6px * var(--sse-s));
  min-height:calc(32px * var(--sse-s));padding:calc(4px * var(--sse-s)) 0;border:0;background:none;
  color:#64748b;font-family:inherit;font-size:calc(13px * var(--sse-s));
  line-height:calc(22px * var(--sse-s));text-align:left;cursor:default}
.sse-hist .lbl{white-space:nowrap}
.sse-hist .sum{color:#8a8f9c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sse-hist .sep{margin-right:calc(6px * var(--sse-s))}
.sse-hist .chev{flex:0 0 auto;opacity:.6}

/* 正文（真实 .md-body） */
.sse-md{font-size:calc(14px * var(--sse-s));line-height:calc(26px * var(--sse-s));
  color:#111827;letter-spacing:.01em;word-break:break-word}
.sse-md p{margin:0;width:100%}
.sse-md p+p{margin-top:calc(8px * var(--sse-s))}
.sse-md strong{font-weight:680;color:#111827}

/* 表格卡片（真实 .foldable-table-wrap + .table-viewport-footer） */
.sse-tblwrap{margin:calc(14px * var(--sse-s)) 0;border:1px solid #eef0f4;
  border-radius:calc(8px * var(--sse-s));background:#fff;overflow:hidden}
.sse-tblscroll{overflow-x:auto;scrollbar-width:thin}
.sse-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;
  font-size:calc(13px * var(--sse-s));line-height:calc(20px * var(--sse-s));color:#111827}
.sse-table th,.sse-table td{padding:calc(9px * var(--sse-s)) calc(12px * var(--sse-s));
  text-align:center;vertical-align:middle;white-space:nowrap;
  border-bottom:1px solid rgba(15,23,42,.06)}
.sse-table th{font-size:calc(12px * var(--sse-s));font-weight:650;color:#4b5563;background:#f8f9fc}
/* 表格单元格里的图片：缩成小缩略图，别把表格撑爆（1024px 原图会直接炸掉表格） */
.sse-table td img{display:block;max-width:calc(44px * var(--sse-s));max-height:calc(44px * var(--sse-s));
  border-radius:calc(4px * var(--sse-s));object-fit:cover}
.sse-table td .md-imgwrap,.sse-table td .md-imgbtn{display:inline-block;max-width:none;margin:0}
.sse-table td .md-imgmask{display:none}
/* 星元「选项卡片」：问题 + 全部选项平铺（不折叠） */
.sse-ask{margin:calc(10px * var(--sse-s)) 0 0;background:#fff;border:1px solid #E3E5F2;
  border-radius:calc(10px * var(--sse-s));overflow:hidden}
.sse-ask{padding:calc(12px * var(--sse-s)) calc(14px * var(--sse-s))}
.sse-ask .q+.q{margin-top:calc(12px * var(--sse-s));padding-top:calc(12px * var(--sse-s));
  border-top:1px dashed #E8EAF4}
.sse-ask .qt{display:flex;gap:calc(6px * var(--sse-s));font-size:calc(13px * var(--sse-s));
  line-height:1.6;color:#1F2233;font-weight:600}
.sse-ask .qt .n{flex:none;color:#8B8FA8;font-weight:400}
.sse-ask .opts{list-style:none;margin-top:calc(7px * var(--sse-s));
  display:flex;flex-direction:column;gap:calc(6px * var(--sse-s))}
.sse-ask .opts li{background:#F7F8FC;border:1px solid #E8EAF4;border-radius:calc(7px * var(--sse-s));
  padding:calc(7px * var(--sse-s)) calc(10px * var(--sse-s))}
.sse-ask .opts .lb{display:block;font-size:calc(12.5px * var(--sse-s));color:#3B3F58;font-weight:600}
.sse-ask .opts .ds{display:block;margin-top:calc(2px * var(--sse-s));
  font-size:calc(11.5px * var(--sse-s));color:#7C809A;line-height:1.55}
.sse-table tbody tr:last-child td{border-bottom:none}
.sse-table tbody tr:nth-child(2n){background:#6366f105}
.sse-tblfoot{display:flex;align-items:center;gap:calc(8px * var(--sse-s));
  min-height:calc(40px * var(--sse-s));padding:calc(5px * var(--sse-s)) calc(12px * var(--sse-s));
  border-top:1px solid #eef0f4}
.sse-tblfoot .hint{font-size:calc(12px * var(--sse-s));color:#8a8f9c}
.sse-tblfoot .act{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;
  width:calc(32px * var(--sse-s));height:calc(32px * var(--sse-s));
  border-radius:calc(6px * var(--sse-s));color:#64748b}
/* 正文里的列表（真实 .md-body ul/li） */
.sse-md ul{list-style-type:disc;margin:calc(10px * var(--sse-s)) 0;padding-left:1.6em;list-style-position:outside}
.sse-md li{margin-bottom:calc(10px * var(--sse-s));line-height:calc(26px * var(--sse-s))}
.sse-md li:last-child{margin-bottom:0}
.sse-md ul li::marker{color:#6366f1;font-size:.85em}
.sse-md li strong{color:inherit}

/* 引用块（真实 .md-body blockquote） */
.sse-md blockquote{margin:calc(12px * var(--sse-s)) 0;padding:calc(8px * var(--sse-s)) calc(14px * var(--sse-s));
  border-left:calc(3px * var(--sse-s)) solid transparent;
  border-image:linear-gradient(180deg,#6366f1,#8b5cf6) 1;
  color:#64748b;background:linear-gradient(90deg,#6366f10f,#6366f103);
  border-radius:0 calc(8px * var(--sse-s)) calc(8px * var(--sse-s)) 0;
  line-height:calc(26px * var(--sse-s))}
.sse-md blockquote p{margin:0}
/* 有序列表 */
.sse-md ol{list-style-type:decimal;margin:calc(10px * var(--sse-s)) 0;padding-left:2.1em;list-style-position:outside}
.sse-md ol li::marker{font-weight:700}
/* 链接 */
.sse-md a{color:#6366f1;text-decoration:none;border-bottom:1px solid rgba(99,102,241,.35)}
/* 内联图片（真实 .md-inline-image-wrap / -btn / -mask） */
.sse-md .md-imgwrap{display:inline-flex;flex-direction:column;align-items:flex-start;max-width:100%;
  margin:calc(8px * var(--sse-s)) 0;vertical-align:top}
.sse-md .md-imgbtn{position:relative;display:block;max-width:min(calc(420px * var(--sse-s)),100%);
  padding:0;border-radius:calc(10px * var(--sse-s));overflow:hidden;background:#fff;
  box-shadow:0 2px 10px #11182714}
.sse-md .md-imgbtn img{display:block;max-width:calc(420px * var(--sse-s));
  max-height:calc(280px * var(--sse-s));border-radius:calc(10px * var(--sse-s));object-fit:contain}
/* 用户消息里的图片（如上传的太阳码）：缩成小缩略图，不占版面 */
.sse-ubub .md-imgwrap{margin:calc(6px * var(--sse-s)) 0 0}
.sse-ubub .md-imgbtn{max-width:min(calc(96px * var(--sse-s)),100%)}
.sse-ubub .md-imgbtn img{max-width:calc(96px * var(--sse-s));max-height:calc(96px * var(--sse-s))}
.sse-md .md-imgmask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#1118275c;color:#fff;font-size:calc(13px * var(--sse-s));font-weight:600;opacity:0}

/* 附件控件：四宫格图标 + 文件名 */
.sse-file{display:inline-flex;align-items:center;gap:calc(6px * var(--sse-s));
  margin-top:calc(6px * var(--sse-s));max-width:100%;
  font-size:calc(14px * var(--sse-s));line-height:calc(22px * var(--sse-s));color:#111827}
.sse-file .ic{flex:none;display:inline-flex}
.sse-file .ic svg{width:calc(16px * var(--sse-s));height:calc(16px * var(--sse-s))}
.sse-file .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 截图块（AI 反问选项面板等） */
.sse-shot{width:100%}
.sse-msg.narrow .sse-shot{width:auto;max-width:76%}
.sse-shot img{display:block;width:100%;height:auto;border-radius:calc(12px * var(--sse-s))}
.sse-ph{width:calc(190px * var(--sse-s));height:calc(56px * var(--sse-s));
  border:1px dashed #dfe3ee;border-radius:calc(8px * var(--sse-s))}

.bwscreen{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#FAFBFF,#EFF1FB)}
.skel{width:78%;display:flex;flex-direction:column;gap:11px;opacity:.62}
.sk-h{height:76px;border-radius:5px;background:linear-gradient(120deg,#DDE2F5,#E9ECFA)}

.qrbox .qr{width:54px;height:54px;border-radius:5px;background:#fff;border:1px solid var(--line);opacity:.62;

/* 后台配置画布 */
.cfg{background:#fff;padding:18px 22px;overflow-y:auto;overscroll-behavior:contain;

.cfg::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(31,34,51,.24)}

.crow{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}
.crow .k{flex:none;width:88px;font-size:12px;font-weight:700;color:var(--brand)}
.crow .v{font-size:12px;color:var(--ink2);line-height:1.55}

/* 成品预览画布 */
.gal{background:#fff;display:flex;flex-direction:column}
.gtiles{flex:1;display:grid;gap:10px;padding:14px;overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:rgba(31,34,51,.24) transparent}
.gtiles::-webkit-scrollbar{width:6px}

.gtiles.n3{grid-template-columns:1fr 1fr 1fr}

.live{background:linear-gradient(150deg,#F5F3FF 0%,#EDE9FF 100%);border:1px solid #DDD6FF;

  overflow-y:auto;overscroll-behavior:contain;scroll-behavior:smooth;scrollbar-width:thin;
  scrollbar-color:rgba(31,34,51,.24) transparent}
.cmdbox::-webkit-scrollbar{width:6px}
.cmdbox::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(31,34,51,.24)}

/* ---------- 总览页 ---------- */
.ovl{position:absolute;left:48px;top:99px;width:208px;height:396px;border-radius:5px;padding:22px 21px;color:#fff;
  background:linear-gradient(150deg,#5B4BF5 0%,#8E7BFF 100%);box-shadow:0 10px 24px rgba(91,75,245,.22)}
.ovl .eb{font-size:9.5px;letter-spacing:.1em;color:rgba(255,255,255,.62)}
.ovl .ovt{margin-top:11px;font-size:25.5px;font-weight:700;line-height:1.28}
.ovl .ovline{width:33px;height:2px;background:rgba(255,255,255,.5);margin:26px 0}
.ovl .ovd{font-size:12.5px;line-height:1.9;color:rgba(255,255,255,.92)}
.ovgrid{position:absolute;left:276px;top:101px;width:636px;display:grid;grid-template-columns:1fr 1fr;gap:11px}
.ccard{height:120px;border-radius:5px;background:rgba(255,255,255,.76);border:1px solid var(--line);padding:14px 16px;position:relative}
.ccard .cno{position:absolute;right:14px;top:10px;font-size:28.5px;font-weight:700;color:var(--brand3);line-height:1;letter-spacing:-.02em}
.ccard .cn{font-size:17px;font-weight:700}
.ccard .ca{margin-top:7px;font-size:11.25px;color:var(--ink2);line-height:1.45;padding-right:22px}
.ccard .cv{margin-top:9px;font-size:10.5px;color:var(--ink3);padding-top:8px;border-top:1px solid var(--line)}

/* 版式说明页专用 */
.ghost{background:rgba(255,255,255,.55)!important;border:1px dashed #B9A8FF!important;box-shadow:none!important;color:var(--ink)!important}
.ghost .eb{color:var(--ink3)!important}
.ghostdraw{border:1px dashed #B9A8FF;background:rgba(255,255,255,.62);box-shadow:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:26px}
.zone{font-size:15px;font-weight:700;color:var(--brand);letter-spacing:.02em}
.zone.big{font-size:19px}
.ghostline{margin-top:9px;font-size:11.5px;line-height:1.85;color:var(--ink2);text-align:center}
.pain.ghost .zone{margin-top:16px}
.pain.ghost .ghostline{text-align:left;line-height:1.75}

/* ===== 会销演示页 · 播放模式 ===== */
html,body.play{height:100%;margin:0;background:#F2F3FD;overflow:hidden}
body.play .dochead{display:none}
body.play .wrap{position:relative;width:100% !important;max-width:none !important;
  height:100vh;margin:0;padding:0;overflow:hidden}
body.play .page{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:0;opacity:0;visibility:hidden;transition:opacity .2s ease}
body.play .page.on{opacity:1;visibility:visible}
body.play .page .cap{display:none}
body.play .stage{width:auto;height:auto}
body.play .frame{transform-origin:center center !important}

/* PPT 原稿页：1280×720 舞台缩到会销的 960×540 */
.slide.ps .pstage{position:absolute;left:0;top:0;width:960px;height:540px}
.pstage{font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
  -webkit-font-smoothing:antialiased}
.pstage .pimg{position:absolute;display:block}
.pstage .pshape{position:absolute;box-sizing:border-box}
.pstage .pbox{position:absolute;box-sizing:border-box}
.pstage .pbox p{margin:0}
.pstage .ptxt{display:flex;flex-direction:column;width:100%;height:100%;box-sizing:border-box}

/* 播放控件 */
.pui{position:fixed;z-index:60;color:rgba(255,255,255,.66);
  font:500 12px/1 "PingFang SC",sans-serif;pointer-events:none;user-select:none}
.pui.num{right:16px;bottom:14px;font-variant-numeric:tabular-nums}
.pui.hint{left:16px;bottom:13px;opacity:.72}
.pui.hint b{font-weight:600;color:rgba(255,255,255,.85)}
.pbar{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12);z-index:61}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5B4BF5,#8E7BFF);transition:width .22s}
.goto{position:fixed;left:50%;transform:translateX(-50%);bottom:30px;background:rgba(18,22,38,.94);
  border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:10px 14px;z-index:80;display:none;
  color:#fff;font:500 13px/1.4 "PingFang SC",sans-serif;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.goto.on{display:block}
.goto input{width:56px;background:transparent;border:1px solid rgba(255,255,255,.28);border-radius:6px;
  color:#fff;font-size:13px;padding:3px 6px;margin:0 6px;text-align:center;outline:none}
.fsflash{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(18,22,38,.92);
  color:#fff;font:600 15px/1 "PingFang SC",sans-serif;padding:14px 20px;border-radius:12px;z-index:90;
  opacity:0;transition:opacity .25s;pointer-events:none}
.fsflash.on{opacity:1}

/* ⚠️ 设计稿给每张 .slide 加了一层 ::before 装饰渐变（定位 inset:0），
   它盖在 PPT 原稿页上会把左侧内容糊掉（2026-09-20 子雁看到的「文字只剩尾巴」就是这个）。
   PPT 页要用原稿的样子，所以直接把装饰层关掉。 */
.slide.ps::before,.slide.ps::after{display:none !important}

/* ⚠️ 设计稿里的 .page 有 max-width（约 1000px），会把 PPT 页的 iframe 卡住 → 屏幕填不满。
   播放模式下必须解除宽度限制，让每页真正铺满视口。 */
body.play .page{width:100% !important;max-width:none !important;margin:0;padding:0;
  display:flex;align-items:center;justify-content:center}
body.play .page.pptpage{display:block;padding:0}

/* ⚠️ 设计稿给 body / .wrap 留了上下间距（body 的 padding + .page 的 margin-bottom:34px），
   播放模式下会在顶部露出一条灰边（实测 iframe 顶部偏移 34px）。全部清零。 */
body.play{margin:0 !important;padding:0 !important;background:#F2F3FD}
body.play .wrap,body.play .page,body.play .page .stage,body.play .page .frame{
  margin:0 !important;padding:0 !important}
body.play .page{margin-bottom:0 !important}


body.play .page.pptpage{padding:0}
.psframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0B0E1A;display:block}
</style>

/* 录屏画布 */

/* 报告 HTML 画布：iframe 原样嵌入。
   ⚠️ 关键点：iframe 的 viewport 宽就是 636，报告按自己那套响应式规则排版，
   字号保持报告原生字号 —— 别用「先按大宽度渲染再缩放」那套（截图才需要），

.emb{background:#fff}

.duo-img+.duo-img{border-top:1px solid rgba(15,23,42,.14)}
/* ⚠️ 这里原来 padding-left:12px —— 会在图与视频之间留一条 12px 黑色缝。

.duo-r{flex:0 0 auto;position:relative;padding-left:0;border-left:1px solid #0F1220;
  display:flex;align-items:stretch}
.duo-r .vstage{position:relative;height:100%;display:flex;align-items:center;overflow:hidden}

.duo-r .vbar{gap:7px;padding:0 8px}

/* 双栏·平分：两张都是竖屏（0.46）素材 → 左右各占一半，各自按高度撑满；

   ⚠️ .vstage 必须 flex:0 0 auto 收成视频宽度，否则 .vbar（absolute left:0 right:0）
   会横跨整个半栏，进度条比视频还长。 */
.duo.duo-eq .duo-l{flex:1 1 0;display:flex;align-items:center;justify-content:flex-end;
  overflow:hidden}
.duo.duo-eq .duo-l .duo-img{width:auto;height:100%;max-width:none}
.duo.duo-eq .duo-r{flex:1 1 0;min-width:0;padding-left:0;justify-content:flex-start;
  border-left:1px solid rgba(255,255,255,.12)}
.duo.duo-eq .duo-r .vstage{flex:0 0 auto;justify-content:flex-start}
/* 四宫格：3 张竖屏截图 + 1 段竖屏录屏，各占 1/4 宽。

   格与格之间只留 1px 画布底色 → 就是子雁要的「一条细线」，不是大黑缝。 */
.quad{background:#0F1220;display:flex;align-items:stretch}
.quad-c{flex:1 1 0;min-width:0;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center}
.quad-c+.quad-c{border-left:1px solid #0F1220}
.quad-c .duo-img{display:block;width:100%;height:100%;object-fit:cover;max-width:none}
.quad-c .vstage{flex:1 1 auto;height:100%;min-width:0}
.quad-c .vsrc{width:100%;height:100%;object-fit:cover;max-width:none;max-height:none}
/* 纯截图画布：竖向拼接、框内可下滑 */
.shots{background:#fff;display:flex}
.shots:has(.shots-bar){flex-direction:column}
.shots-bar{flex:none;display:flex;gap:8px;padding:9px 12px;align-items:center;
  background:linear-gradient(180deg,rgba(255,255,255,.78),#fff 42%);border-top:1px solid rgba(15,23,42,.10)}
.lbtn{cursor:pointer;text-decoration:none;flex:none;border:1px solid var(--brand);border-radius:4px;
  padding:0 12px;height:27px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:#fff;
  background:var(--brand);transition:.15s;white-space:nowrap}
.lbtn:hover{filter:brightness(1.08)}
/* 可点素材图：整张图就是入口（报告类素材直接铺全文长图，点击新窗口打开原文件） */
.shot-a{display:block;position:relative;text-decoration:none;cursor:pointer}
.shot-a .duo-img{transition:filter .15s}
.shot-a:hover .duo-img{filter:brightness(.985)}
.shot-hint{position:absolute;top:10px;right:10px;z-index:2;pointer-events:none;
  font-size:11px;font-weight:700;color:#fff;background:rgba(31,34,51,.72);
  border-radius:4px;padding:4px 9px;backdrop-filter:blur(2px)}
/* 图内精确热区：透明覆盖，静态画面无痕；鼠标移上去才描边提示 */
.shot-wrap{position:relative}
.shot-hot{position:absolute;display:block;border-radius:6px;cursor:pointer;
  transition:background .15s,box-shadow .15s}
.shot-hot:hover{background:rgba(90,80,230,.12);box-shadow:0 0 0 2px rgba(90,80,230,.5) inset}
.shots-l{flex:1 1 auto;min-width:0;position:relative;overflow-y:auto;overscroll-behavior:contain;
  scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.3) transparent}
.shots-l::-webkit-scrollbar{width:6px}
.shots-l::-webkit-scrollbar-track{background:transparent}
.shots-l::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(0,0,0,.3)}
.shots-cmd{padding:18px 16px 24px}
.shots-cmd .cmdbox{flex:none;margin-top:10px}
/* 拼在截图后面的会话分享：跟着外层一起滑，自己不再滚动 */
.sse-embed{background:#fff;border-top:1px solid var(--line)}
.sse-embed .sse-inner{height:auto;overflow:visible;padding-bottom:28px}
/* 混排画布：左栏宽幅截图竖排可滑，右栏竖版素材并排（图/录屏同宽高，1px 细线分隔） */
.mix{background:#0F1220;display:flex;align-items:stretch}
.mix-l{flex:1 1 auto;min-width:0;position:relative;overflow-y:auto;overscroll-behavior:contain;
  scroll-behavior:smooth;background:#fff;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.3) transparent}
.mix-l::-webkit-scrollbar{width:6px}
.mix-l::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(0,0,0,.3)}
.mix-l .duo-img+.duo-img{border-top:1px solid rgba(15,23,42,.14)}
.mix-r{flex:0 0 auto;display:flex;align-items:stretch;border-left:1px solid #0F1220}
.mix-c{flex:0 0 auto;display:flex;align-items:center;overflow:hidden;border-left:1px solid #0F1220}
.mix-c:first-child{border-left:0}
.mix-c>.duo-img{width:auto;height:100%;max-width:none}
.mix-c .vstage{flex:0 0 auto;height:100%}
.mix-c .vsrc{height:100%;width:auto;max-height:none;max-width:none}
/* 截图可点全屏：全屏时按原比例居中（不裁切），右下角给个hover才出现的小全屏图标 */
.quad-c.zoomy,.mix-c.zoomy{cursor:zoom-in}
.quad-c.zoomy:fullscreen,.quad-c.zoomy:-webkit-full-screen,
.mix-c.zoomy:fullscreen,.mix-c.zoomy:-webkit-full-screen{background:#0F1220}
.quad-c:fullscreen .duo-img,.quad-c:-webkit-full-screen .duo-img,
.mix-c:fullscreen .duo-img,.mix-c:-webkit-full-screen .duo-img{
  width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
.quad-c.zoomy::after,.mix-c.zoomy::after{
  content:"⤢";position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:5px;
  background:rgba(15,18,32,.62);color:#fff;font-size:13px;line-height:22px;text-align:center;
  opacity:0;transition:opacity .16s}
.quad-c.zoomy:hover::after,.mix-c.zoomy:hover::after{opacity:1}

/* 全屏（容器全屏）：背景黑，控制条放大，绝无浏览器自带控件 */
.vstage:fullscreen,.vstage:-webkit-full-screen{background:#000;display:flex;align-items:center;
  justify-content:center}
.vstage:fullscreen .vbar,.vstage:-webkit-full-screen .vbar{height:64px;padding:0 30px;gap:18px}
.vstage:fullscreen .vpb,.vstage:-webkit-full-screen .vpb{width:40px;height:40px}
.vstage:fullscreen .vpb i,.vstage:-webkit-full-screen .vpb i{
  border-left-width:18px;border-top-width:12px;border-bottom-width:12px}
.vstage:fullscreen .vpb.on i,.vstage:-webkit-full-screen .vpb.on i{width:17px;height:20px;
  background:linear-gradient(90deg,currentColor 0 5px,rgba(0,0,0,0) 5px 12px,currentColor 12px 17px)}
.vstage:fullscreen .vseek,.vstage:-webkit-full-screen .vseek{height:5px}
.vstage:fullscreen .vseek::-webkit-slider-thumb,.vstage:-webkit-full-screen .vseek::-webkit-slider-thumb{
  width:17px;height:17px}
.vstage:fullscreen .vtime,.vstage:-webkit-full-screen .vtime{font-size:15px}
.vstage:fullscreen .vfs,.vstage:-webkit-full-screen .vfs{width:38px;height:38px}
/* 全屏时竖屏视频按自身比例居中（两侧黑边）—— 不要被格子里那句 object-fit:cover 撑满整屏 */
.vstage:fullscreen .vsrc,.vstage:-webkit-full-screen .vsrc{
  width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain}
.vstage:fullscreen .vfs svg,.vstage:-webkit-full-screen .vfs svg{width:22px;height:22px}
.vstage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.vsrc{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain}
.vplay{width:60px;height:60px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);position:relative}
.vplay::after{content:"";position:absolute;left:23px;top:18px;border-left:20px solid #fff;
  border-top:12px solid transparent;border-bottom:12px solid transparent}

/* 会话实录 / 网页画布 */
.bw{background:#fff;display:flex;flex-direction:column}
.bwbar{height:32px;flex:none;background:#EDEFF6;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line)}
.bwbar i{width:8px;height:8px;border-radius:50%;background:#CFD3E0}
.bwbar .url{margin-left:8px;font-size:10.5px;color:var(--ink3);background:#fff;border-radius:3px;padding:3px 12px;flex:1;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bwbody{flex:1;position:relative;overflow:hidden}
/* 会话分享画布 —— 一比一复刻微盟星元真实分享页
   真实值 × --sse-s 缩放；改 sse-s 即可整体放大缩小 */
.sse{background:#fff;--sse-s:.8}
.sse-inner{position:relative;z-index:1;height:100%;padding:calc(32px * var(--sse-s)) 15px calc(40px * var(--sse-s));
  display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
  scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(31,34,51,.24) transparent}
.sse-inner::-webkit-scrollbar{width:6px}
.sse-inner::-webkit-scrollbar-track{background:transparent}
.sse-inner::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(31,34,51,.24)}
.sse-head{display:flex;align-items:center;gap:calc(16px * var(--sse-s));
  padding-bottom:calc(22px * var(--sse-s));border-bottom:1px solid #eef0f3}
.sse-brand{display:grid;place-items:center;width:calc(48px * var(--sse-s));height:calc(48px * var(--sse-s));
  flex:0 0 auto;border-radius:calc(14px * var(--sse-s));color:#fff;
  background:linear-gradient(135deg,#6d5dfc,#8b5cf6);
  font-size:calc(17px * var(--sse-s));font-weight:700}
.sse-meta h1{margin:0;color:#111827;font-size:calc(22px * var(--sse-s));line-height:1.35;font-weight:600}
.sse-meta p{margin:calc(6px * var(--sse-s)) 0 0;color:#9ca3af;font-size:calc(13px * var(--sse-s))}
.sse-notice{margin-top:calc(18px * var(--sse-s));padding:calc(10px * var(--sse-s)) calc(14px * var(--sse-s));
  border-radius:calc(8px * var(--sse-s));color:#6b7280;background:#f7f8fa;
  font-size:calc(13px * var(--sse-s));line-height:1.5}
.sse-msgs{padding:calc(26px * var(--sse-s)) 0}
.sse-msg{display:flex;gap:calc(10px * var(--sse-s))}
.sse-msg.user{flex-direction:row-reverse;justify-content:flex-start}
.sse-msg.ai{align-items:flex-start;margin-top:calc(22px * var(--sse-s))}
.sse-msg.user:not(:first-child){margin-top:calc(16px * var(--sse-s))}

/* 用户消息：浅灰气泡 + 复制按钮（真实 _userBubble / _userContentStack） */
.sse-ustack{display:flex;flex-direction:column;align-items:flex-end;gap:calc(8px * var(--sse-s));width:100%}
.sse-ubub{max-width:min(76%,calc(360px * var(--sse-s)));padding:calc(9px * var(--sse-s)) calc(14px * var(--sse-s));
  border-radius:calc(16px * var(--sse-s)) calc(16px * var(--sse-s)) calc(4px * var(--sse-s));
  background:#f3f4f6;color:#111827;
  font-size:calc(14px * var(--sse-s));line-height:calc(22px * var(--sse-s))}
.sse-uact{display:flex;align-items:center;gap:calc(2px * var(--sse-s));opacity:.55}
.sse-uact .btn{display:inline-flex;align-items:center;justify-content:center;
  width:calc(32px * var(--sse-s));height:calc(32px * var(--sse-s));
  border-radius:calc(6px * var(--sse-s));color:#8a8f9c}

/* 星元回复：AI logo + 查看处理详情 + 正文 */
.sse-aibody{min-width:0;max-width:100%;width:100%}
.sse-aihead{display:flex;align-items:center}
.sse-aimark{display:inline-flex;align-items:center;justify-content:flex-start;
  width:calc(104px * var(--sse-s));height:calc(32px * var(--sse-s))}
.sse-aimark img{display:block;width:calc(90px * var(--sse-s));height:auto;
  max-height:calc(32px * var(--sse-s));object-fit:contain}
.sse-blocks{margin-top:calc(10px * var(--sse-s));display:flex;flex-direction:column;gap:calc(8px * var(--sse-s))}
.sse-hist{display:flex;align-items:center;width:100%;min-height:calc(32px * var(--sse-s));
  border-bottom:1px solid #e9eaf0;margin-bottom:calc(8px * var(--sse-s))}
.sse-hist button{display:flex;flex-wrap:nowrap;align-items:center;gap:calc(6px * var(--sse-s));
  min-height:calc(32px * var(--sse-s));padding:calc(4px * var(--sse-s)) 0;border:0;background:none;
  color:#64748b;font-family:inherit;font-size:calc(13px * var(--sse-s));
  line-height:calc(22px * var(--sse-s));text-align:left;cursor:default}
.sse-hist .lbl{white-space:nowrap}
.sse-hist .sum{color:#8a8f9c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sse-hist .sep{margin-right:calc(6px * var(--sse-s))}
.sse-hist .chev{flex:0 0 auto;opacity:.6}

/* 正文（真实 .md-body） */
.sse-md{font-size:calc(14px * var(--sse-s));line-height:calc(26px * var(--sse-s));
  color:#111827;letter-spacing:.01em;word-break:break-word}
.sse-md p{margin:0;width:100%}
.sse-md p+p{margin-top:calc(8px * var(--sse-s))}
.sse-md strong{font-weight:680;color:#111827}

/* 表格卡片（真实 .foldable-table-wrap + .table-viewport-footer） */
.sse-tblwrap{margin:calc(14px * var(--sse-s)) 0;border:1px solid #eef0f4;
  border-radius:calc(8px * var(--sse-s));background:#fff;overflow:hidden}
.sse-tblscroll{overflow-x:auto;scrollbar-width:thin}
.sse-table{width:100%;border-collapse:separate;border-spacing:0;background:#fff;
  font-size:calc(13px * var(--sse-s));line-height:calc(20px * var(--sse-s));color:#111827}
.sse-table th,.sse-table td{padding:calc(9px * var(--sse-s)) calc(12px * var(--sse-s));
  text-align:center;vertical-align:middle;white-space:nowrap;
  border-bottom:1px solid rgba(15,23,42,.06)}
.sse-table th{font-size:calc(12px * var(--sse-s));font-weight:650;color:#4b5563;background:#f8f9fc}
/* 表格单元格里的图片：缩成小缩略图，别把表格撑爆（1024px 原图会直接炸掉表格） */
.sse-table td img{display:block;max-width:calc(44px * var(--sse-s));max-height:calc(44px * var(--sse-s));
  border-radius:calc(4px * var(--sse-s));object-fit:cover}
.sse-table td .md-imgwrap,.sse-table td .md-imgbtn{display:inline-block;max-width:none;margin:0}
.sse-table td .md-imgmask{display:none}
/* 星元「选项卡片」：问题 + 全部选项平铺（不折叠） */
.sse-ask{margin:calc(10px * var(--sse-s)) 0 0;background:#fff;border:1px solid #E3E5F2;
  border-radius:calc(10px * var(--sse-s));overflow:hidden}
.sse-ask{padding:calc(12px * var(--sse-s)) calc(14px * var(--sse-s))}
.sse-ask .q+.q{margin-top:calc(12px * var(--sse-s));padding-top:calc(12px * var(--sse-s));
  border-top:1px dashed #E8EAF4}
.sse-ask .qt{display:flex;gap:calc(6px * var(--sse-s));font-size:calc(13px * var(--sse-s));
  line-height:1.6;color:#1F2233;font-weight:600}
.sse-ask .qt .n{flex:none;color:#8B8FA8;font-weight:400}
.sse-ask .opts{list-style:none;margin-top:calc(7px * var(--sse-s));
  display:flex;flex-direction:column;gap:calc(6px * var(--sse-s))}
.sse-ask .opts li{background:#F7F8FC;border:1px solid #E8EAF4;border-radius:calc(7px * var(--sse-s));
  padding:calc(7px * var(--sse-s)) calc(10px * var(--sse-s))}
.sse-ask .opts .lb{display:block;font-size:calc(12.5px * var(--sse-s));color:#3B3F58;font-weight:600}
.sse-ask .opts .ds{display:block;margin-top:calc(2px * var(--sse-s));
  font-size:calc(11.5px * var(--sse-s));color:#7C809A;line-height:1.55}
.sse-table tbody tr:last-child td{border-bottom:none}
.sse-table tbody tr:nth-child(2n){background:#6366f105}
.sse-tblfoot{display:flex;align-items:center;gap:calc(8px * var(--sse-s));
  min-height:calc(40px * var(--sse-s));padding:calc(5px * var(--sse-s)) calc(12px * var(--sse-s));
  border-top:1px solid #eef0f4}
.sse-tblfoot .hint{font-size:calc(12px * var(--sse-s));color:#8a8f9c}
.sse-tblfoot .act{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;
  width:calc(32px * var(--sse-s));height:calc(32px * var(--sse-s));
  border-radius:calc(6px * var(--sse-s));color:#64748b}
/* 正文里的列表（真实 .md-body ul/li） */
.sse-md ul{list-style-type:disc;margin:calc(10px * var(--sse-s)) 0;padding-left:1.6em;list-style-position:outside}
.sse-md li{margin-bottom:calc(10px * var(--sse-s));line-height:calc(26px * var(--sse-s))}
.sse-md li:last-child{margin-bottom:0}
.sse-md ul li::marker{color:#6366f1;font-size:.85em}
.sse-md li strong{color:inherit}

/* 引用块（真实 .md-body blockquote） */
.sse-md blockquote{margin:calc(12px * var(--sse-s)) 0;padding:calc(8px * var(--sse-s)) calc(14px * var(--sse-s));
  border-left:calc(3px * var(--sse-s)) solid transparent;
  border-image:linear-gradient(180deg,#6366f1,#8b5cf6) 1;
  color:#64748b;background:linear-gradient(90deg,#6366f10f,#6366f103);
  border-radius:0 calc(8px * var(--sse-s)) calc(8px * var(--sse-s)) 0;
  line-height:calc(26px * var(--sse-s))}
.sse-md blockquote p{margin:0}
/* 有序列表 */
.sse-md ol{list-style-type:decimal;margin:calc(10px * var(--sse-s)) 0;padding-left:2.1em;list-style-position:outside}
.sse-md ol li::marker{font-weight:700}
/* 链接 */
.sse-md a{color:#6366f1;text-decoration:none;border-bottom:1px solid rgba(99,102,241,.35)}
/* 内联图片（真实 .md-inline-image-wrap / -btn / -mask） */
.sse-md .md-imgwrap{display:inline-flex;flex-direction:column;align-items:flex-start;max-width:100%;
  margin:calc(8px * var(--sse-s)) 0;vertical-align:top}
.sse-md .md-imgbtn{position:relative;display:block;max-width:min(calc(420px * var(--sse-s)),100%);
  padding:0;border-radius:calc(10px * var(--sse-s));overflow:hidden;background:#fff;
  box-shadow:0 2px 10px #11182714}
.sse-md .md-imgbtn img{display:block;max-width:calc(420px * var(--sse-s));
  max-height:calc(280px * var(--sse-s));border-radius:calc(10px * var(--sse-s));object-fit:contain}
/* 用户消息里的图片（如上传的太阳码）：缩成小缩略图，不占版面 */
.sse-ubub .md-imgwrap{margin:calc(6px * var(--sse-s)) 0 0}
.sse-ubub .md-imgbtn{max-width:min(calc(96px * var(--sse-s)),100%)}
.sse-ubub .md-imgbtn img{max-width:calc(96px * var(--sse-s));max-height:calc(96px * var(--sse-s))}
.sse-md .md-imgmask{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:#1118275c;color:#fff;font-size:calc(13px * var(--sse-s));font-weight:600;opacity:0}

/* 附件控件：四宫格图标 + 文件名 */
.sse-file{display:inline-flex;align-items:center;gap:calc(6px * var(--sse-s));
  margin-top:calc(6px * var(--sse-s));max-width:100%;
  font-size:calc(14px * var(--sse-s));line-height:calc(22px * var(--sse-s));color:#111827}
.sse-file .ic{flex:none;display:inline-flex}
.sse-file .ic svg{width:calc(16px * var(--sse-s));height:calc(16px * var(--sse-s))}
.sse-file .nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 截图块（AI 反问选项面板等） */
.sse-shot{width:100%}
.sse-msg.narrow .sse-shot{width:auto;max-width:76%}
.sse-shot img{display:block;width:100%;height:auto;border-radius:calc(12px * var(--sse-s))}
.sse-ph{width:calc(190px * var(--sse-s));height:calc(56px * var(--sse-s));
  border:1px dashed #dfe3ee;border-radius:calc(8px * var(--sse-s))}

.bwscreen{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#FAFBFF,#EFF1FB)}
.skel{width:78%;display:flex;flex-direction:column;gap:11px;opacity:.62}
.sk-h{height:76px;border-radius:5px;background:linear-gradient(120deg,#DDE2F5,#E9ECFA)}
.sk-r{height:13px;border-radius:3px;background:#E2E6F3}
.sk-r.short{width:56%}
.sk-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px;margin-top:4px}
.sk-grid i{height:62px;border-radius:5px;background:#E7EBF8}
.qrbox{position:absolute;right:18px;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:6px}
.qrbox .qr{width:54px;height:54px;border-radius:5px;background:#fff;border:1px solid var(--line);opacity:.62;
  background-image:linear-gradient(90deg,#1F2233 25%,transparent 25%,transparent 50%,#1F2233 50%,#1F2233 75%,transparent 75%);
  background-size:9px 9px}
.qrbox span{font-size:9px;color:var(--ink3)}

/* 后台配置画布 */
.cfg{background:#fff;padding:18px 22px;overflow-y:auto;overscroll-behavior:contain;
  scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:rgba(31,34,51,.24) transparent}
.cfg::-webkit-scrollbar{width:6px}
.cfg::-webkit-scrollbar-thumb{border-radius:999px;background:rgba(31,34,51,.24)}
.cfghead{font-size:9.5px;letter-spacing:.1em;color:var(--ink3);text-transform:uppercase;margin-bottom:8px}
.crow{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}

<script id="deck-js" type="text/plain">
(function(){
  function fit(){
    if (document.body.classList.contains('play')) return;   // 播放模式由播放器自己缩放
    document.querySelectorAll('.stage').forEach(function(st){
      var s = Math.min(1, st.clientWidth/960);
      st.querySelector('.frame').style.transform = 'scale('+s+')';
      st.style.height = (540*s)+'px';
    });
  }
  document.addEventListener('DOMContentLoaded', function(){
    fit();
    function goFullscreen(el) {
      // navigationUI:'hide' 尽量让浏览器收起导航类提示
      try {
        if (el.requestFullscreen) { el.requestFullscreen({ navigationUI: 'hide' }); return; }
      } catch (e) {}
      var fs = el.webkitRequestFullscreen;
      if (fs) { try { fs.call(el); } catch (e) {} }
    }
    function fmtTime(t) {
      if (!isFinite(t) || t < 0) t = 0;
      var m = Math.floor(t / 60), s = Math.floor(t % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }
    document.querySelectorAll('.vbar').forEach(function(bar){
      var stage = bar.closest('.vstage');
      var v   = stage.querySelector('.vsrc');
      var pb  = bar.querySelector('.vpb');
      var sk  = bar.querySelector('.vseek');
      var tm  = bar.querySelector('.vtime');
      var fsb = bar.querySelector('.vfs');
      if (!v || !pb || !sk || !stage) return;

      function sync() {
        pb.classList.toggle('on', !v.paused);
        if (tm) tm.textContent = fmtTime(v.currentTime) + ' / ' + fmtTime(v.duration || 0);
        if (sk && v.duration) sk.value = String(Math.round(v.currentTime / v.duration * 1000));
      }

      pb.addEventListener('click', function(){
        if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function(){}); }
        else v.pause();
      });

      sk.addEventListener('input', function(){
        if (v.duration) { v.currentTime = v.duration * (Number(sk.value) / 1000); sync(); }
      });

      v.addEventListener('loadedmetadata', sync);
      v.addEventListener('timeupdate', sync);
      v.addEventListener('ended', sync);
      v.addEventListener('pause', sync);

      // 竖屏录屏：一播放就自动进全屏（全屏目标是容器，不是 video —— 避免浏览器弹出自己的音量控件）
      v.addEventListener('play', function(){
        sync();
        if (!document.fullscreenElement) goFullscreen(stage);
      });

      if (fsb) fsb.addEventListener('click', function(){
        if (document.fullscreenElement) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else {
          if (v.paused) { var p = v.play(); if (p && p.catch) p.catch(function(){}); }
          goFullscreen(stage);
        }
      });
    });
    document.addEventListener('fullscreenchange', function(){
      var on = !!document.fullscreenElement;
      document.querySelectorAll('.vfs').forEach(function(b){
        b.classList.toggle('on', on);
        b.setAttribute('aria-label', on ? '退出全屏' : '全屏');
      });
    });
    // 四宫格/混排里的截图：点一下整格全屏（全屏时按原比例居中，不裁切）
    document.querySelectorAll('.quad-c, .mix-c').forEach(function(cell){
      if (!cell.querySelector('img')) return;
      cell.classList.add('zoomy');
      cell.setAttribute('role', 'button');
      cell.setAttribute('tabindex', '0');
      cell.setAttribute('aria-label', '点击全屏查看');
      cell.addEventListener('click', function(){
        // 竖图全屏时，用同一张图做虚化铺底，避免两侧黑边
        var im = cell.querySelector('img');
        if (im && im.getAttribute('src')) {
          cell.style.setProperty('--bgimg', "url('" + im.getAttribute('src') + "')");
        }
        if (document.fullscreenElement) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else {
          goFullscreen(cell);
        }
      });
      cell.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); cell.click(); }
      });
    });
    // 开场轮播页：点一下开始，一条播完自动切下一条（循环）
    (function(){
      var car = document.querySelector('.slide.car');
      if (!car) return;
      var tiles = Array.prototype.slice.call(car.querySelectorAll('.ctile'));
      var ov = car.querySelector('.cplay');
      if (!tiles.length || !ov) return;
      var cur = -1, timer = null, started = false;

      function armTimer(sec){
        clearTimeout(timer);
        timer = setTimeout(function(){ next(); }, Math.max(2000, (sec + 0.4) * 1000));
      }
      function next(){ if (started) show(cur + 1); }
      function show(i){
        cur = (i + tiles.length) % tiles.length;   // 取模 → 第 3 条播完自动回到第 1 条
        tiles.forEach(function(t, k){
          t.classList.toggle('on', k === cur);
          var v = t.querySelector('.cvsrc'); if (!v) return;
          if (k === cur) {
            v.muted = false;                       // 依次播放，同一时刻只有一条出声
            try { v.currentTime = 0; } catch (e) {}
            var pr = v.play();
            if (pr && pr.catch) pr.catch(function(){
              v.muted = true;                      // 被自动播放策略拦下就退回静音，至少画面要走
              var p2 = v.play(); if (p2 && p2.catch) p2.catch(function(){});
            });
            if (v.duration && isFinite(v.duration)) armTimer(v.duration);
          } else {
            try { v.pause(); } catch (e) {}
          }
          t.classList.remove('paused');
        });
      }
      tiles.forEach(function(t, k){
        var v = t.querySelector('.cvsrc'); if (!v) return;
        v.addEventListener('ended', function(){ if (started) show(k + 1); });
        v.addEventListener('loadedmetadata', function(){
          if (started && k === cur) armTimer(v.duration);
        });
      });
      // 点瓦片：当前条 → 暂停/继续；其它条 → 直接切过去播（子雁要求）
      function markCur(){
        tiles.forEach(function(t, k){
          var v = t.querySelector('.cvsrc');
          t.classList.toggle('on', k === cur);
          t.classList.toggle('paused', !!(v && v.paused && k === cur));
        });
      }
      tiles.forEach(function(t, k){
        var v = t.querySelector('.cvsrc'); if (!v) return;
        t.style.cursor = 'pointer';
        t.addEventListener('click', function(ev){
          ev.stopPropagation();
          started = true;
          ov.classList.add('off');
          if (k === cur) {
            if (v.paused) {
              var pr = v.play();
              if (pr && pr.catch) pr.catch(function(){});
              if (v.duration && isFinite(v.duration)) armTimer(Math.max(1, v.duration - v.currentTime));
            } else {
              v.pause();
              clearTimeout(timer);
            }
            markCur();
          } else {
            show(k);                       // 切到这一条，从头播
          }
        });
      });

      ov.addEventListener('click', function(){ started = true; ov.classList.add('off'); show(0); });
    })();

    document.querySelectorAll('.chip[data-i]').forEach(function(c){
      c.addEventListener('click', function(){
        var g = c.closest('.chips');
        g.querySelectorAll('.chip').forEach(function(x){x.classList.remove('on')});
        c.classList.add('on');
        var panes = g.nextElementSibling;
        panes.querySelectorAll('.pane').forEach(function(p){p.classList.remove('on')});
        var pg = panes.children[+c.dataset.i];
        pg.classList.add('on');
        // 报告 HTML 画布：第一次切到该页签才载入，src 带上这一段对应的章节锚点，
        // 浏览器加载完直接把报告滚到那一段（三个页签共用同一份报告，只是落点不同）
        var ef = pg.querySelector('.embf');
        if (ef && !ef.dataset.on) {
          ef.dataset.on = '1';
          ef.src = ef.dataset.src + (ef.dataset.hash ? '#' + ef.dataset.hash : '');
        }
        // 左边「星元入口」跟着切到对应动作的那条
        // ⚠️ 不能找 .page —— 设计稿页被放进了 iframe，iframe 里没有 .page，要用 .slide
        var scope = c.closest('.slide') || c.closest('.wrap') || document;
        var panel = scope.querySelector('.route');
        if (panel) {
          var boxes = panel.querySelectorAll('.rbox');
          boxes.forEach(function(b){b.classList.remove('on')});
          if (boxes[+c.dataset.i]) boxes[+c.dataset.i].classList.add('on');
        }
      });
    });

    // 默认打开的那个页签里若是报告 HTML，也要按锚点先载入
    document.querySelectorAll('.panes > .pane.on .embf').forEach(function(ef){
      ef.dataset.on = '1';
      ef.src = ef.dataset.src + (ef.dataset.hash ? '#' + ef.dataset.hash : '');
    });
  });
  window.addEventListener('resize', fit);
})();
</script>

          ef.dataset.on = '1';
          ef.src = ef.dataset.src + (ef.dataset.hash ? '#' + ef.dataset.hash : '');
        }
        // 左边「星元入口」跟着切到对应动作的那条
        // ⚠️ 不能找 .page —— 设计稿页被放进了 iframe，iframe 里没有 .page，要用 .slide
        var scope = c.closest('.slide') || c.closest('.wrap') || document;
        var panel = scope.querySelector('.route');
        if (panel) {
          var boxes = panel.querySelectorAll('.rbox');
          boxes.forEach(function(b){b.classList.remove('on')});
          if (boxes[+c.dataset.i]) boxes[+c.dataset.i].classList.add('on');
        }
      });
    });

    // 默认打开的那个页签里若是报告 HTML，也要按锚点先载入
    document.querySelectorAll('.panes > .pane.on .embf').forEach(function(ef){
      ef.dataset.on = '1';
      ef.src = ef.dataset.src + (ef.dataset.hash ? '#' + ef.dataset.hash : '');
    });
  });
  window.addEventListener('resize', fit);
})();

/* 会销演示页 · 播放器（PPT 式翻页） */
(function () {
  function init() {
    var P = Array.prototype.slice.call(document.querySelectorAll('.wrap .page'));
    if (!P.length) return;
    var i = 0;
    var numEl = document.querySelector('.pui.num');
    var barEl = document.querySelector('.pbar i');
    var gotoEl = document.querySelector('.goto');
    var flash = document.querySelector('.fsflash');
    var flashT = null;

    function toast(msg) {
      if (!flash) return;
      flash.textContent = msg;
      flash.classList.add('on');
      clearTimeout(flashT);
      flashT = setTimeout(function () { flash.classList.remove('on'); }, 1100);
    }

    // 三种画面模式（按 S 循环切换）：
    //   stretch = 拉伸铺满（默认）：宽高各自拉满屏幕，四边顶满、不裁内容，比例有轻微拉伸
    //   cover   = 撑满裁切：等比例放大铺满，左右会裁掉约 5%
    //   fill    = 不留黑边：等比例完整显示，四周用同色底铺满（内容不裁但会留窄边）
    var fitMode = 'stretch';

    function scaleFor(w, h) {
      if (fitMode === 'stretch') return [w, h];                    // 拉伸铺满：四边顶满
      var s = (fitMode === 'cover') ? Math.max(w, h) : Math.min(w, h);
      return [s, s];
    }

    // 把焦点从 iframe 里收回来（收回到父页面，方向键才会走父页面的处理）
    function blurFrames() {
      var ae = document.activeElement;
      if (ae && ae.tagName === 'IFRAME') { try { ae.blur(); } catch (e) {} }
      document.querySelectorAll('.psframe').forEach(function (f) {
        try { if (f === document.activeElement) f.blur(); } catch (e) {}
      });
      try { window.focus(); } catch (e) {}
    }

    function fitAll() {
      var w = window.innerWidth / 960, h = window.innerHeight / 540;
      var sc = scaleFor(w, h);
      P.forEach(function (p) {
        if (p.classList.contains('pptpage')) return;   // iframe 自己缩放
        var f = p.querySelector('.frame');
        if (f) f.style.transform = 'scale(' + sc[0] + ',' + sc[1] + ')';
      });
      document.querySelectorAll('.psframe').forEach(function (f) {
        try { f.contentWindow.postMessage({ src: 'host', kind: 'fit', mode: fitMode }, '*'); } catch (err) {}
      });
    }

    function go(n) {
      // ⚠️ 点播放后视频舞台会自动全屏；此时翻页是在全屏层「底下」翻，肉眼看起来像按键失灵。
      //    所以翻页前先把全屏退掉。
      // 只退「iframe 里的视频全屏」——那种全屏会盖住翻页，必须退；
      // 但 F 键开启的「整册全屏」（全屏元素是页面容器）要保留，否则全屏下翻不了页。
      var _fe = document.fullscreenElement || document.webkitFullscreenElement;
      if (_fe && _fe.tagName === 'IFRAME') {
        try {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } catch (e) {}
      }
      var prev = i;
      i = Math.max(0, Math.min(P.length - 1, n));
      window.mountPageFrames && window.mountPageFrames(P, i, prev);   // 先备好画面，再切
      P.forEach(function (p, k) { p.classList.toggle('on', k === i); });
      // ⚠️ 关键：点击页面后焦点会停在那个 iframe 上；翻页把它的文档卸载了、元素却还握着焦点，
      //    之后方向键全送进空 iframe → 表现为「点了页面翻页之后方向键全失灵」。
      blurFrames();
      if (numEl) numEl.textContent = (i + 1) + ' / ' + P.length;
      if (barEl) barEl.style.width = ((i + 1) / P.length * 100) + '%';
      document.title = '星元会销 · 智启经营（' + (i + 1) + '/' + P.length + '）';
    }

    // 编辑模式：所有 iframe 进入 designMode，可直接点文字改内容（改的是本页面，刷新即还原）
    var editing = false;

    function toggleEdit() {
      editing = !editing;
      document.querySelectorAll('.psframe').forEach(function (f) {
        try {
          var d = f.contentDocument || f.contentWindow.document;
          d.designMode = editing ? 'on' : 'off';
          if (editing) {
            d.querySelectorAll('.vsrc').forEach(function (v) { try { v.pause(); } catch (e) {} });
          }
        } catch (e) {}
      });
      document.body.classList.toggle('editing', editing);
      toast(editing ? '编辑模式：直接点文字就能改（再按 E 退出）' : '已退出编辑模式');
    }

    function toggleFs() {
      if (document.fullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        var el = document.documentElement;
        if (el.requestFullscreen) el.requestFullscreen({ navigationUI: 'hide' });
        else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
        else toast('浏览器不支持全屏');
      }
    }

    function askGoto() {
      if (!gotoEl) return;
      gotoEl.classList.add('on');
      var inp = gotoEl.querySelector('input');
      inp.value = i + 1;
      inp.focus();
      inp.select();
    }

    function doGoto() {
      var inp = gotoEl.querySelector('input');
      var v = parseInt(inp.value, 10);
      gotoEl.classList.remove('on');
      if (!isNaN(v)) go(v - 1);
    }

    function handleKey(e) {
      // 方向/翻页键任何时候都生效（编辑模式下也翻页）。之前这里直接 return，
      // 结果点过「编辑」之后上下左右全失效 —— 就是子雁说的「按着按着就不好使」。
      var NAV_KEYS = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: 1, ArrowUp: 1,
                       PageDown: 1, PageUp: 1, ' ': 1, Enter: 1, Backspace: 1,
                       Home: 1, End: 1 };
      if (editing && !NAV_KEYS.hasOwnProperty(e.key)) return;   // 编辑模式下只让非方向键归光标
      var t = e.target || {};
      if (gotoEl && gotoEl.classList.contains('on')) {
        if (e.key === 'Enter') { e.preventDefault(); doGoto(); }
        else if (e.key === 'Escape') { gotoEl.classList.remove('on'); }
        return;
      }
      if (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' ||
          e.key === 'PageDown' || e.key === 'Enter') { e.preventDefault(); go(i + 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp' ||
               e.key === 'Backspace') { e.preventDefault(); go(i - 1); }
      else if (e.key === 'Home') { e.preventDefault(); go(0); }
      else if (e.key === 'End') { e.preventDefault(); go(P.length - 1); }
      else if (e.key === 'f' || e.key === 'F') { toggleFs(); }
      else if (e.key === 'g' || e.key === 'G') { askGoto(); }
      else if (e.key === 'e' || e.key === 'E') { toggleEdit(); }
      else if (e.key === 's' || e.key === 'S') {
        fitMode = (fitMode === 'stretch') ? 'cover' : (fitMode === 'cover' ? 'fill' : 'stretch');
        refitSoon();
        toast(fitMode === 'stretch' ? '画面：拉伸铺满'
              : (fitMode === 'cover' ? '画面：撑满裁切（会裁边）' : '画面：不留黑边（保留原比例）'));
      }
    }

    document.addEventListener('keydown', handleKey);

    // PPT 页在 iframe 里渲染，按键/点击由内部转发上来
    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.src !== 'ppt') return;
      if (d.kind === 'key') {
        handleKey({ key: d.key, target: {}, preventDefault: function () {} });
        if (d.key.indexOf('Arrow') === 0 || d.key === ' ' || d.key.indexOf('Page') === 0) blurFrames();
      } else if (d.kind === 'click') { go(i + 1); blurFrames(); }
    });

    document.addEventListener('click', function (e) {
      if (gotoEl && gotoEl.classList.contains('on')) {
        if (!e.target.closest('.goto')) gotoEl.classList.remove('on');
        return;
      }
      if (editing) return;                      // 编辑模式：点击用于定位光标，不翻页
      // 交互元件自己处理点击，不要顺带翻页
      if (e.target.closest('button, input, video, a, .chip, .quad-c, .vstage, .vbar, .sse-uact, .goto, .cplay, .ctile, .cvsrc, .editbar')) return;
      go(i + 1);
      blurFrames();
    });

    var x0 = null;
    document.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', function (e) {
      if (x0 === null) return;
      var dx = e.changedTouches[0].clientX - x0;
      x0 = null;
      if (Math.abs(dx) > 45) go(i + (dx < 0 ? 1 : -1));
    }, { passive: true });

    function refitSoon() {
      fitAll();
      requestAnimationFrame(fitAll);
      setTimeout(fitAll, 120);
      setTimeout(fitAll, 400);
    }
    window.addEventListener('resize', refitSoon);
    document.addEventListener('fullscreenchange', refitSoon);
    window.addEventListener('orientationchange', refitSoon);
    refitSoon();
    go(0);
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();

/* 把设计稿页也放进 iframe 隔离渲染。
   宿主 DOM 里同样会出现「文字左侧被裁」，而 iframe（独立文档）里渲染结果与单独渲染一致。
   设计稿的 CSS/JS 只存一份（页面里的两个 text/plain 脚本），这里给每页拼 srcdoc。 */
(function () {
  var cssEl = document.getElementById('deck-css');
  var jsEl = document.getElementById('deck-js');
  if (!cssEl || !jsEl) return;
  var css = cssEl.textContent, js = jsEl.textContent;

  var INNER_CSS = 'html,body{margin:0;height:100%;background:#F2F3FD;overflow:hidden}'
    + '#stage{position:absolute;left:0;top:0;width:960px;height:540px;overflow:hidden;'
    + 'transform-origin:top left;background:#fff}';

  var INNER_JS =
    'var mode="stretch";'
    + 'function fit(){var w=innerWidth/960,h=innerHeight/540;var sx=w,sy=h;'
    + 'if(mode!=="stretch"){var u=(mode==="cover")?Math.max(w,h):Math.min(w,h);sx=u;sy=u;}'
    + 'var e=document.getElementById("stage");e.style.transformOrigin="top left";'
    + 'e.style.transform="translate("+((innerWidth-960*sx)/2)+"px,"+((innerHeight-540*sy)/2)+"px) scale("+sx+","+sy+")";'
    // ★ 二维码是正方形：如果整体被非等比拉伸（大屏常见），反向缩放把它掰回正方形，
    //   否则在大屏上会被拉成长方形（子雁 2026-09-21 反馈）
    + 'var q=document.getElementById("finqr");if(q){var k=Math.sqrt(sx*sy);'
    + 'q.style.transformOrigin="center center";'
    // k = 几何平均：只修「宽高比」，不改变二维码相对页面的观感大小
    + 'q.style.transform="scale("+(k/sx)+","+(k/sy)+")";}}'
    + 'window.addEventListener("resize",fit);setTimeout(fit,80);setTimeout(fit,400);'
    + 'window.addEventListener("message",function(ev){var d=ev.data||{};'
    + 'if(d.src==="host"&&d.kind==="fit"){mode=d.mode;fit();}});'
    + 'document.addEventListener("keydown",function(ev){'
    + 'parent.postMessage({src:"ppt",kind:"key",key:ev.key},"*");'
    + 'if(ev.key===" "||ev.key.indexOf("Arrow")===0||ev.key.indexOf("Page")===0)ev.preventDefault();});'
    + 'document.addEventListener("click",function(ev){'
    + 'if(ev.target.closest("button,input,video,a,.chip,.quad-c,.vstage,.vbar,.sse-uact,.cplay,.ctile,.cvsrc"))return;'
    + 'parent.postMessage({src:"ppt",kind:"click"},"*");});';

  var S = 'scr' + 'ipt>';

  // ⚠️ 懒装载：初始不写 srcdoc，只给「当前页」装载，其余页卸载
  //    （28 个文档一起解析会把页面卡到打不开）
  window.__deckSrc = { css: css, js: js };
  window.mountDeckFrame = function (pg) {
    var f = pg.querySelector('.psframe'), tpl = pg.querySelector('template');
    if (!f || !tpl || f.getAttribute('srcdoc')) return;
    var doc = '<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>'
      + css + INNER_CSS + '</style></head><body class="play">'
      + '<div id="stage"><div class="wrap">' + tpl.innerHTML + '</div></div>'
      + '<' + S + js + '</' + S + '<' + S + INNER_JS + '</' + S
      + '</body></html>';
    var pgIdx = Array.prototype.indexOf.call(document.querySelectorAll('.wrap .page'), pg);
    if (window.__applySaved) doc = window.__applySaved(pgIdx, doc, '<div class="wrap">', '</div></div>');
    f.setAttribute('srcdoc', doc);
  };
  window.unmountDeckFrame = function (pg) {
    var f = pg.querySelector('.psframe');
    if (f && f.getAttribute('srcdoc')) f.removeAttribute('srcdoc');
  };
  // 装载某一页
  function mountOne(p, k, f) {
    if (pendingUnmount.hasOwnProperty(k)) {          // 要用了，撤掉待卸载
      clearTimeout(pendingUnmount[k]);
      delete pendingUnmount[k];
    }
    if (f.getAttribute('srcdoc')) return;
    var d = f.getAttribute('data-srcdoc');       // ⚠️ data-srcdoc 挂在 iframe 上，不是 .page
    if (d) {
      if (window.__applySaved) d = window.__applySaved(k, d, '<div id="stage">', '</div><scr');
      f.setAttribute('srcdoc', d);
    } else {
      window.mountDeckFrame(p);
    }
  }

  // 卸载某一页（延迟版：上一条要等淡出动画结束再卸，否则淡出时露白 → 看起来「跳一下」）
  // ⚠️ 必须能取消：快速翻页时，之前排下的定时器会在「翻回那一页之后」才触发，
  //    把正在看的当前页清空 → 直接黑屏（子雁 2026-09-21 报的「翻着翻着就黑屏」就是这个）。
  var pendingUnmount = {};
  function unmountOne(p, f, delay, k) {
    if (pendingUnmount.hasOwnProperty(k)) {          // 先撤掉之前排的
      clearTimeout(pendingUnmount[k]);
      delete pendingUnmount[k];
    }
    var run = function () {
      delete pendingUnmount[k];
      try { f.blur(); } catch (e) {}
      if (p.querySelector('template')) window.unmountDeckFrame(p);
      else if (f.getAttribute('srcdoc')) f.removeAttribute('srcdoc');
    };
    if (delay) pendingUnmount[k] = setTimeout(run, delay); else run();
  }

  // ⚠️ 翻页卡顿的根因：原来「当前页装载」和「旧页立刻卸载」同时做，
  //    旧页淡出时已经是空白、新页又还没渲染完 → 肉眼看到「跳一下」。
  //    现在：① 当前页 + 下一页都提前装好（切过去立刻有画面）② 上一条延迟到淡出结束再卸。
  window.mountPageFrames = function (pages, idx, prevIdx) {
    var keep = {};
    keep[idx] = 1;
    if (idx + 1 < pages.length) keep[idx + 1] = 1;          // 预载下一条
    pages.forEach(function (p, k) {
      var f = p.querySelector('.psframe');
      if (!f) return;
      if (keep[k]) {
        mountOne(p, k, f);
      } else {
        var isPrev = (k === prevIdx);
        if (f.getAttribute('srcdoc')) unmountOne(p, f, isPrev ? 900 : 0, k);
      }
    });
  };

})();
</script>
</body>
</html>
